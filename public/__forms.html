<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head>
<body>
  <!-- Static copies so Netlify detects the forms at deploy time. Fields must match the React forms. -->
  <form name="lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="lead" />
    <input name="bot-field" />
    <input type="email" name="email" />
    <input type="text" name="source" />
    <input type="text" name="resource" />
    <input type="text" name="consent" />
  </form>
  <form name="blog-newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="blog-newsletter" />
    <input name="bot-field" />
    <input type="email" name="email" />
    <input type="text" name="source" />
    <input type="text" name="consent" />
  </form>
  <form name="consultation-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="consultation-request" />
    <input name="bot-field" />
    <input type="text" name="consultation_type" />
    <input type="text" name="price" />
    <input type="text" name="parent_first_name" />
    <input type="text" name="parent_last_name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="dog_name_age" />
    <input type="text" name="dog_breed_sex" />
    <textarea name="consultation_reason"></textarea>
    <textarea name="availability"></textarea>
    <textarea name="goals"></textarea>
    <textarea name="children_ages"></textarea>
    <textarea name="other_dogs"></textarea>
    <textarea name="previous_training"></textarea>
    <textarea name="special_instructions"></textarea>
    <textarea name="referral_source"></textarea>
  </form>
</body>
</html>
